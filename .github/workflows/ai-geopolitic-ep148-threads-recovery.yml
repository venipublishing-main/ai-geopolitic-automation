name: AI Geopolitic Ep148 Threads one-shot recovery (claim-preserving)

on:
  push:
    branches: [main]
    paths:
      - publisher_signals/threads-ep148-recovery-20261116.json

permissions:
  contents: write

concurrency:
  group: ai-geopolitic-threads-serial-release
  cancel-in-progress: false

jobs:
  tests:
    name: Recovery security and Threads publisher regression tests (no Meta POST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.4.1 Pillow==11.3.0
      - run: python -m pytest -q tests/test_threads_media.py tests/test_threads_release.py tests/test_threads_recover_ep148.py

  recover:
    name: Ep148 only — read-only duplicate check, durable recovery claim, one Meta publication
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Configure signed GitHub state writes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
      - name: Recover exact Ep148 Threads publication
        env:
          AI_GEO_THREADS_ACCESS_TOKEN: ${{ secrets.AI_GEO_THREADS_ACCESS_TOKEN }}
        run: python -m src.threads_recover_ep148
      - name: Preserve claim and report ambiguous outcomes
        if: always()
        run: |
          echo 'The original Threads Ep148 claim and separate one-shot recovery claim must never be removed or blindly retried.'
          echo 'No Instagram or Reel publication endpoints are called by this workflow.'
