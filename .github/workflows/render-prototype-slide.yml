name: Render Milestone 3.2 portrait calibration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render NORA prototype
        run: |
          python src/render_prototype_slide.py \
            --input inputs/prototype-slide.json \
            --output output/prototype-slide.png

      - name: Render Johan prototype
        run: |
          python src/render_prototype_slide.py \
            --input inputs/johan-containment.json \
            --output output/johan-containment.png

      - name: Render Diane calibration
        run: |
          python src/render_prototype_slide.py \
            --input inputs/diane-portrait-calibration.json \
            --output output/diane-portrait-calibration.png

      - name: Render Kai calibration
        run: |
          python src/render_prototype_slide.py \
            --input inputs/kai-portrait-calibration.json \
            --output output/kai-portrait-calibration.png

      - name: Render Thabo calibration
        run: |
          python src/render_prototype_slide.py \
            --input inputs/thabo-portrait-calibration.json \
            --output output/thabo-portrait-calibration.png

      - name: Render Amari calibration
        run: |
          python src/render_prototype_slide.py \
            --input inputs/amari-portrait-calibration.json \
            --output output/amari-portrait-calibration.png

      - name: Upload rendered prototypes to GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-geopolitic-milestone-3_2-portrait-calibration
          path: |
            output/prototype-slide.png
            output/johan-containment.png
            output/diane-portrait-calibration.png
            output/kai-portrait-calibration.png
            output/thabo-portrait-calibration.png
            output/amari-portrait-calibration.png
          if-no-files-found: error
          retention-days: 14

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' \
            '[ai_geopolitic_drive]' \
            'type = drive' \
            "client_id = ${RCLONE_DRIVE_CLIENT_ID}" \
            "client_secret = ${RCLONE_DRIVE_CLIENT_SECRET}" \
            'scope = drive' \
            "token = ${RCLONE_DRIVE_TOKEN}" \
            "root_folder_id = ${AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID}" \
            > ~/.config/rclone/rclone.conf

      - name: Upload renders to Google Drive
        run: |
          DEST='Automation - Temporary Artifacts/Portrait Calibration'
          rclone mkdir ai_geopolitic_drive:"${DEST}"
          rclone copyto output/prototype-slide.png ai_geopolitic_drive:"${DEST}/prototype-slide.png" --progress
          rclone copyto output/johan-containment.png ai_geopolitic_drive:"${DEST}/johan-containment.png" --progress
          rclone copyto output/diane-portrait-calibration.png ai_geopolitic_drive:"${DEST}/diane-portrait-calibration.png" --progress
          rclone copyto output/kai-portrait-calibration.png ai_geopolitic_drive:"${DEST}/kai-portrait-calibration.png" --progress
          rclone copyto output/thabo-portrait-calibration.png ai_geopolitic_drive:"${DEST}/thabo-portrait-calibration.png" --progress
          rclone copyto output/amari-portrait-calibration.png ai_geopolitic_drive:"${DEST}/amari-portrait-calibration.png" --progress
