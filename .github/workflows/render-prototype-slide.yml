name: Render Milestone 3.1 prototypes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render NORA prototype
        run: |
          python src/render_prototype_slide.py \
            --input inputs/prototype-slide.json \
            --output output/prototype-slide.png

      - name: Render Johan prototype
        run: |
          python src/render_prototype_slide.py \
            --input inputs/johan-containment.json \
            --output output/johan-containment.png

      - name: Upload rendered prototypes
        uses: actions/upload-artifact@v4
        with:
          name: ai-geopolitic-milestone-3_1-prototypes
          path: |
            output/prototype-slide.png
            output/johan-containment.png
          if-no-files-found: error
          retention-days: 14
