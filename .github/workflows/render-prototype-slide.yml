name: Render Milestone 3.1 prototypes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render NORA prototype
        run: |
          python src/render_prototype_slide.py \
            --input inputs/prototype-slide.json \
            --output output/prototype-slide.png

      - name: Render Johan prototype
        run: |
          python src/render_prototype_slide.py \
            --input inputs/johan-containment.json \
            --output output/johan-containment.png

      - name: Upload rendered prototypes to GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-geopolitic-milestone-3_1-prototypes
          path: |
            output/prototype-slide.png
            output/johan-containment.png
          if-no-files-found: error
          retention-days: 14

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' \
            '[ai_geopolitic_drive]' \
            'type = drive' \
            'scope = drive' \
            "token = ${RCLONE_DRIVE_TOKEN}" \
            "root_folder_id = ${AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID}" \
            > ~/.config/rclone/rclone.conf

      - name: Upload renders to Google Drive
        run: |
          rclone mkdir ai_geopolitic_drive:"Automation - Temporary Artifacts/Portrait Calibration"
          rclone copy output/prototype-slide.png ai_geopolitic_drive:"Automation - Temporary Artifacts/Portrait Calibration" --progress
          rclone copy output/johan-containment.png ai_geopolitic_drive:"Automation - Temporary Artifacts/Portrait Calibration" --progress
