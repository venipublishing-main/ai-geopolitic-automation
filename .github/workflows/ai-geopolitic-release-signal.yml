name: AI Geopolitic — authenticated episode release signal

on:
  push:
    branches: [main]
    paths:
      - 'publisher_signals/launch-*.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: ai-geopolitic-release-signal-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Validate one new request and dispatch exact gated publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Run fail-closed signal schema tests
        run: |
          python -m pip install pytest==8.4.1
          python -m pytest -q tests/test_release_signal.py
      - name: Validate GitHub actor, exact release and one-time claim before dispatch
        env:
          GH_ACTION_TOKEN: ${{ github.token }}
        run: python -m src.release_signal
