name: Render Milestone 4.4 layout routing proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full QA suite
        run: pytest -q

      - name: Render routed episode proof
        run: |
          python src/route_episode.py \
            --manifest inputs/routing-proof-episode.json \
            --output-dir output/routing-proof

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-geopolitic-milestone-4_4-routing-proof
          path: output/routing-proof/
          if-no-files-found: error
          retention-days: 14

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' \
            '[ai_geopolitic_drive]' \
            'type = drive' \
            "client_id = ${RCLONE_DRIVE_CLIENT_ID}" \
            "client_secret = ${RCLONE_DRIVE_CLIENT_SECRET}" \
            'scope = drive' \
            "token = ${RCLONE_DRIVE_TOKEN}" \
            "root_folder_id = ${AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID}" \
            > ~/.config/rclone/rclone.conf

      - name: Upload routing proof to Google Drive
        run: |
          DEST='Automation - Temporary Artifacts/Layout Routing Proof'
          rclone mkdir ai_geopolitic_drive:"${DEST}"
          rclone copy output/routing-proof/ ai_geopolitic_drive:"${DEST}" --progress
