name: R2 v3.1 4x5 and render integrity QA

on:
  push:
    branches:
      - feat/r2-v3-3x4-compositor-20261104
      - feat/r2-1-v3-1-4x5-render-qc-20261110
      - feat/r2-2-v31-scene-layering-20261110
      - feat/r2-2-adaptive-type-surfaces-20261110
      - feat/r2-2c-canonical-proof-20261111
  pull_request:
    branches:
      - feat/v3-10-slide-readiness-20261104
      - feat/r2-v3-3x4-compositor-20261104
      - feat/r2-1-v3-1-4x5-render-qc-20261110
      - feat/r2-2-v31-scene-layering-20261110

permissions:
  contents: read

jobs:
  r2-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline testing dependencies
        run: python -m pip install pytest==8.4.1 Pillow==11.3.0
      - name: Run R1b plus R2 pure deterministic tests
        env:
          R2_SYNTHETIC_QA_PREVIEW: output/r2-qa/SYNTHETIC_NONPUBLISHABLE_4x5_QA_01.png
          R2_LAYER_QA_PREVIEW: output/r2-qa/SYNTHETIC_NONPUBLISHABLE_LAYER_01.png
          R2_ADAPTIVE_PROOF: output/r2-qa/SYNTHETIC_NONPUBLISHABLE_MATERIAL_01.png
        run: python -m pytest -q tests/test_daily_readiness.py tests/test_v3_readiness.py tests/test_v3_drive_proof.py tests/test_v3_compositor.py tests/test_v3_render_qc.py tests/test_v3_adaptive_layout.py tests/test_v3_canonical_proof.py
      - name: Save synthetic nonpublishable compositor proof for QA review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r2-synthetic-nonpublishable-4x5
          path: output/r2-qa/SYNTHETIC_NONPUBLISHABLE_4x5_QA_01.png
          retention-days: 2
          if-no-files-found: error
      - name: Save portrait-protected scene layering proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r2-layered-scene-synthetic-nonpublishable
          path: output/r2-qa/SYNTHETIC_NONPUBLISHABLE_LAYER_01.png
          retention-days: 2
          if-no-files-found: error
      - name: Retain adaptive surface synthetic proof for actual visual inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r2-adaptive-material-synthetic-nonpublishable
          path: output/r2-qa/SYNTHETIC_NONPUBLISHABLE_MATERIAL_01.png
          retention-days: 2
          if-no-files-found: error
      - name: Package ONLY public-compatible source for isolated real-canon local QA
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          output = Path('output/r2-qa/R22C_SOURCE_ONLY_LOCAL_TEST.zip')
          output.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for p in sorted(Path('src').rglob('*.py')):
                  z.write(p, p.as_posix())
              z.write('config/characters.json', 'config/characters.json')
              z.write('requirements.txt', 'requirements.txt')
          PY
      - name: Short-lived no-private-asset source bundle for approved local test
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r22c-source-only-local-proof
          path: output/r2-qa/R22C_SOURCE_ONLY_LOCAL_TEST.zip
          retention-days: 1
          if-no-files-found: error
