name: Generate test card

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Headline for the test card"
        required: false
        default: "AI GEOPOLITIC"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate card
        run: |
          python src/generate_test_card.py --title "${{ inputs.title }}" --output output/test-card.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-geopolitic-test-card
          path: output/test-card.png
          if-no-files-found: error
          retention-days: 7