name: Render Milestone 4.3F Amari layout family

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full QA suite
        run: pytest -q

      - name: Render Amari layout family
        run: |
          python src/render_amari_layout_family.py --input inputs/amari-regional-memory.json --output output/amari-regional-memory.png
          python src/render_amari_layout_family.py --input inputs/amari-dignity-pathway.json --output output/amari-dignity-pathway.png
          python src/render_amari_layout_family.py --input inputs/amari-humanitarian-map.json --output output/amari-humanitarian-map.png
          python src/render_amari_layout_family.py --input inputs/amari-cross-border-bridge.json --output output/amari-cross-border-bridge.png
          python src/render_amari_layout_family.py --input inputs/amari-cultural-landscape.json --output output/amari-cultural-landscape.png
          python src/make_contact_sheet.py --files output/amari-regional-memory.png output/amari-dignity-pathway.png output/amari-humanitarian-map.png output/amari-cross-border-bridge.png output/amari-cultural-landscape.png --output output/amari-layout-family-contact-sheet.png --cols 3 --thumb 320

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-geopolitic-milestone-4_3f-amari-layout-family
          path: output/amari-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' \
            '[ai_geopolitic_drive]' \
            'type = drive' \
            "client_id = ${RCLONE_DRIVE_CLIENT_ID}" \
            "client_secret = ${RCLONE_DRIVE_CLIENT_SECRET}" \
            'scope = drive' \
            "token = ${RCLONE_DRIVE_TOKEN}" \
            "root_folder_id = ${AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID}" \
            > ~/.config/rclone/rclone.conf

      - name: Upload Amari family proofs to Google Drive
        run: |
          DEST='Automation - Temporary Artifacts/Layout Families/Amari'
          rclone mkdir ai_geopolitic_drive:"${DEST}"
          rclone copy output/ ai_geopolitic_drive:"${DEST}" --include 'amari-*.png' --progress
