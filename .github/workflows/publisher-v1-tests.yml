name: Publisher v1 read-only staging QA (no posting)

on:
  push:
    branches:
      - feat/publisher-v1-archive-selection-20261112
  pull_request:
    branches:
      - automation-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated dependencies
        run: python -m pip install Pillow==11.3.0 pytest==8.4.1
      - name: Execute no-network, no-social-publishing publisher regressions
        run: python -m pytest -q tests/test_publisher_v1.py tests/test_publisher_instagram.py tests/test_publisher_meta_probe.py

      - name: Verify the connected Ai_Geopolitic account without posting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/publisher-v1-archive-selection-20261112'
        env:
          AI_GEO_IG_ACCESS_TOKEN: ${{ secrets.AI_GEO_IG_ACCESS_TOKEN }}
        run: python -m src.publisher_meta_probe
      - name: Install rclone
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/publisher-v1-archive-selection-20261112'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
      - name: Validate Drive OAuth credentials without revealing them
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/publisher-v1-archive-selection-20261112'
        env:
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          if [ -z "${RCLONE_DRIVE_TOKEN}" ]; then
            echo "::error::BLOCKED: RCLONE_DRIVE_TOKEN is not configured in this repository."
            exit 2
          fi
          mkdir -p ~/.config/rclone
          chmod 700 ~/.config/rclone
          {
            printf '[ai_geopolitic_drive]\n'
            printf 'type = drive\n'
            printf 'scope = drive.readonly\n'
            printf 'client_id = %s\n' "${RCLONE_DRIVE_CLIENT_ID}"
            printf 'client_secret = %s\n' "${RCLONE_DRIVE_CLIENT_SECRET}"
            printf 'token = %s\n' "${RCLONE_DRIVE_TOKEN}"
            if [ -n "${AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID}" ]; then
              printf 'root_folder_id = %s\n' "${AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID}"
            fi
          } > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if ! rclone lsjson ai_geopolitic_drive: --drive-root-folder-id 1QcCh-qMHOH97ZWdTLULwNygibJcZRb4q --dirs-only --no-modtime > /tmp/ai-geo-archives.json 2>/tmp/ai-geo-drive-error.txt; then
            python - <<'PY'
            from pathlib import Path
            error=Path("/tmp/ai-geo-drive-error.txt").read_text(errors="ignore").lower()
            if "invalid_grant" in error or "token has been expired" in error: code="TOKEN_REFRESH_REJECTED"
            elif "unknown flag" in error: code="RCLONE_FLAG_UNSUPPORTED"
            elif "invalid_client" in error: code="OAUTH_CLIENT_MISMATCH"
            elif "403" in error or "permission denied" in error: code="DRIVE_PERMISSION_DENIED"
            elif "401" in error: code="DRIVE_UNAUTHORIZED"
            elif "404" in error or "not found" in error: code="ARCHIVE_ROOT_NOT_FOUND"
            elif "failed to create file system" in error: code="FILESYSTEM_SETUP_FAILED"
            else: code="DRIVE_READ_FAILED"
            print("::error::BLOCKED: "+code+" (no authentication details displayed)")
            PY
            exit 3
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("/tmp/ai-geo-archives.json").read_text())
          match=[f for f in doc if f.get("Name")=="Ep144-12November2026" and f.get("IsDir")==True and f.get("ID")=="1ZN-dWSeCFBZ8h3Sy7mmzLDmujRjbdKaM"]
          if len(match)!=1:
              raise SystemExit("BLOCKED: archival readback did not match pinned Ep144 identity.")
          print("DRIVE_READ_ONLY_CONNECTED: verified pinned archive parent and historical episode.")
          print("NO_UPLOAD_NO_PUBLICATION")
          PY
      - name: Remove transient OAuth config
        if: always()
        run: rm -f ~/.config/rclone/rclone.conf /tmp/ai-geo-archives.json /tmp/ai-geo-drive-error.txt

  stage-test-media:
    name: Stage public TEST-only JPEGs for one future QA post
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/publisher-v1-archive-selection-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: ai-geopolitic-qa-media-20261113
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/publisher-v1-archive-selection-20261112
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create ten distinct TEST ONLY delivery JPEGs
        run: |
          python -m pip install Pillow==11.3.0
          python -m src.publisher_cli --mode test-deck --out /tmp/qa-media
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          images=sorted(Path("/tmp/qa-media/TEST_DECK").glob("TEST_Slide??of10.jpg"))
          assert len(images)==10
          for i,p in enumerate(images,1):
              assert p.name==f"TEST_Slide{i:02d}of10.jpg"
              with Image.open(p) as im:
                  assert im.format=="JPEG" and im.size==(1080,1350)
          print("TEN_DISTINCT_QA_JPEGS_VERIFIED")
          PY
      - name: Publish public QA files to dedicated media branch (not Instagram)
        run: |
          if git ls-remote --heads origin refs/heads/publisher-test-media-20261113 | grep -q .; then
            echo "MEDIA_BRANCH_ALREADY_PRESENT: not overwriting."
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git switch --orphan publisher-test-media-20261113
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p media/qa-20261113
          cp /tmp/qa-media/TEST_DECK/TEST_Slide??of10.jpg media/qa-20261113/
          git add media/qa-20261113
          git commit -m "Stage ten TEST ONLY images for Ep145 carousel commissioning"
          git push origin HEAD:refs/heads/publisher-test-media-20261113
          echo "PUBLIC_QA_BRANCH_CREATED: no Instagram publication."
