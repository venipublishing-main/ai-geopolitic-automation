name: Publisher v1 read-only staging QA (no posting)

on:
  push:
    branches:
      - feat/publisher-v1-archive-selection-20261112
  pull_request:
    branches:
      - automation-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated dependencies
        run: python -m pip install Pillow==11.3.0 pytest==8.4.1
      - name: Execute no-network, no-social-publishing publisher regressions
        run: python -m pytest -q tests/test_publisher_v1.py tests/test_publisher_instagram.py
