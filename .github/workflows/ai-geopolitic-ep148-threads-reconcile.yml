name: AI Geopolitic Ep148 Threads GET-only incident reconciliation

on:
  push:
    branches: [main]
    paths:
      - publisher_signals/threads-ep148-reconcile-20261116.json
      - .github/workflows/ai-geopolitic-ep148-threads-reconcile.yml

permissions:
  contents: read

jobs:
  reconcile:
    name: Read-only Threads publication check — no Meta POST
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependency
        run: python -m pip install Pillow==11.3.0
      - name: Verify Ep148 claim, authenticated account and recent Threads posts
        env:
          AI_GEO_THREADS_ACCESS_TOKEN: ${{ secrets.AI_GEO_THREADS_ACCESS_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from src.threads_release import caption_match, verify_published_post

          path = Path("publisher_state/threads-ep148-20261116.json")
          claim = json.loads(path.read_text(encoding="utf-8"))
          assert claim["episode"] == "Ep148"
          assert claim["date_sast"] == "2026-11-16"
          assert claim["status"] == "CLAIMED_NO_AUTOMATIC_RETRY"
          assert claim["threads_account"] == "ai_geopolitic"
          assert claim["threads_user_id"] == "40667622232822942"
          token = os.environ.get("AI_GEO_THREADS_ACCESS_TOKEN", "")
          assert len(token) > 16, "Missing Threads credential"
          sha = claim["public_media_commit"]
          assert len(sha) == 40 and all(c in "0123456789abcdef" for c in sha)
          url = ("https://raw.githubusercontent.com/venipublishing-main/ai-geopolitic-automation/"
                 + sha + "/publisher_media/threads-ep148-20261116/caption.txt")
          canonical = urllib.request.urlopen(url, timeout=25).read(512).decode("utf-8")
          assert hashlib.sha256(canonical.encode()).hexdigest() == claim["caption_sha256"]

          def get(path, fields):
              url = "https://graph.threads.net/v1.0" + path + "?" + urllib.parse.urlencode(fields)
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "User-Agent": "ai-geopolitic-threads-ep148-readonly-reconcile/1.0"})
              try:
                  with urllib.request.urlopen(request, timeout=35) as response:
                      return json.loads(response.read(262144))
              except urllib.error.HTTPError as exc:
                  try:
                      error = json.loads(exc.read(16384)).get("error", {})
                  except Exception:
                      error = {}
                  print("THREADS_GET_ERROR " + json.dumps({
                      "http_status": exc.code,
                      "meta_code": error.get("code"),
                      "meta_subcode": error.get("error_subcode"),
                      "meta_type": error.get("type"),
                  }, sort_keys=True))
                  raise SystemExit("Read-only Meta GET failed; no publishing was attempted")

          identity = get("/me", {"fields": "id,username"})
          assert str(identity.get("id")) == claim["threads_user_id"]
          assert str(identity.get("username","")).lower().lstrip("@") == claim["threads_account"]

          page = get("/me/threads", {
              "fields": "id,text,permalink,media_type,timestamp",
              "limit": "50"})
          posts = page.get("data", [])
          assert isinstance(posts, list) and len(posts) <= 50, "Unexpected timeline response"
          matches = []
          recent = []
          for post in posts:
              if not isinstance(post, dict):
                  continue
              post_id = str(post.get("id", ""))
              recent.append({
                  "id": post_id,
                  "timestamp": post.get("timestamp"),
                  "media_type": post.get("media_type"),
              })
              normalized = caption_match(canonical, post.get("text"))
              if normalized:
                  detail = get("/" + post_id, {
                      "fields": "id,username,text,permalink,media_type,children"})
                  verified = verify_published_post(post_id, canonical, detail)
                  matches.append({
                      "id": post_id,
                      "caption_mode": normalized,
                      "verified_post": verified,
                  })
          print("EP148_READ_ONLY_RECONCILIATION " + json.dumps({
              "account": claim["threads_account"],
              "recent_count": len(posts),
              "most_recent_posts": recent[:5],
              "matched_count": len(matches),
              "matching_posts": matches,
              "meta_write_performed": False,
          }, sort_keys=True))
          if matches:
              print("POSSIBLE_EXISTING_POST_DO_NOT_RETRY")
          else:
              print("NO_EP148_CAPTION_IN_MOST_RECENT_50_POSTS; CLAIM_REMAINS_LOCKED")
          PY
