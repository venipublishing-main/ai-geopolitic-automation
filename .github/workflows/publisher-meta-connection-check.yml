name: AI Geopolitic — READ-ONLY Meta account check

on:
  push:
    branches:
      - feat/publisher-v1-archive-selection-20261112
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ai-geopolitic-meta-readonly-connection
  cancel-in-progress: true

jobs:
  verify-identity-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout checked publisher source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline safety tests before accessing the credential
        run: python -m pip install pytest==8.4.1 && python -m pytest -q tests/test_publisher_meta_probe.py
      - name: Validate Meta token and Ai_Geopolitic assignment (GET requests only)
        env:
          AI_GEO_IG_ACCESS_TOKEN: ${{ secrets.AI_GEO_IG_ACCESS_TOKEN }}
        run: python -m src.publisher_meta_probe
