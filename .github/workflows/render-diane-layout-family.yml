name: Render Milestone 4.3C Diane layout family

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full QA suite
        run: pytest -q

      - name: Render Diane layout family
        run: |
          python src/render_diane_layout_family.py --input inputs/diane-market-grid.json --output output/diane-market-grid.png
          python src/render_diane_layout_family.py --input inputs/diane-transmission-chain.json --output output/diane-transmission-chain.png
          python src/render_diane_layout_family.py --input inputs/diane-fiscal-flow.json --output output/diane-fiscal-flow.png
          python src/render_diane_layout_family.py --input inputs/diane-portfolio-pipeline.json --output output/diane-portfolio-pipeline.png
          python src/render_diane_layout_family.py --input inputs/diane-regional-economy.json --output output/diane-regional-economy.png
          python src/make_contact_sheet.py --files output/diane-market-grid.png output/diane-transmission-chain.png output/diane-fiscal-flow.png output/diane-portfolio-pipeline.png output/diane-regional-economy.png --output output/diane-layout-family-contact-sheet.png --cols 3 --thumb 320

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-geopolitic-milestone-4_3c-diane-layout-family
          path: output/diane-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' \
            '[ai_geopolitic_drive]' \
            'type = drive' \
            "client_id = ${RCLONE_DRIVE_CLIENT_ID}" \
            "client_secret = ${RCLONE_DRIVE_CLIENT_SECRET}" \
            'scope = drive' \
            "token = ${RCLONE_DRIVE_TOKEN}" \
            "root_folder_id = ${AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID}" \
            > ~/.config/rclone/rclone.conf

      - name: Upload Diane family proofs to Google Drive
        run: |
          DEST='Automation - Temporary Artifacts/Layout Families/Diane'
          rclone mkdir ai_geopolitic_drive:"${DEST}"
          rclone copy output/ ai_geopolitic_drive:"${DEST}" --include 'diane-*.png' --progress
