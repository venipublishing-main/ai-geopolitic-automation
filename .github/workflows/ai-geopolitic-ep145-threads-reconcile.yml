name: AI Geopolitic Ep145 Threads read-only reconciliation
on:
  push:
    branches: [main]
    paths:
      - publisher_signals/threads-ep145-reconcile-20261113.json
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read-only Threads API status and compare publication
        env:
          AI_GEO_THREADS_ACCESS_TOKEN: ${{ secrets.AI_GEO_THREADS_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib, json, os, urllib.parse, urllib.request
          from pathlib import Path

          receipt = json.loads(Path("publisher_state/threads-ep145-20261113.json").read_text())
          assert receipt["status"] == "CLAIMED_NO_AUTOMATIC_RETRY"
          assert receipt["episode"] == "Ep145" and receipt["threads_account"] == "ai_geopolitic"
          token = os.environ.get("AI_GEO_THREADS_ACCESS_TOKEN", "")
          if not token:
              raise SystemExit("Missing Threads token; no write attempted")
          def get(path, params):
              url = "https://graph.threads.net/v1.0" + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "User-Agent": "ai-geopolitic-threads-read-only-reconciler/1.0"})
              with urllib.request.urlopen(req, timeout=35) as response:
                  return json.loads(response.read(262144))
          identity = get("/me", {"fields":"id,username"})
          if identity.get("username","").lower().lstrip("@") != "ai_geopolitic":
              raise SystemExit("Wrong Threads identity; no writes")
          data = get("/me/threads", {"fields":"id,text,permalink,media_type,timestamp","limit":"50"}).get("data",[])
          if not isinstance(data,list):
              raise SystemExit("Unreadable Threads timeline")
          expected = receipt["caption_sha256"]
          matches = []
          candidates = []
          for post in data:
              if not isinstance(post,dict):
                  continue
              caption = post.get("text") or ""
              fingerprint = hashlib.sha256(caption.encode("utf-8")).hexdigest()
              summary = {k:post.get(k) for k in ("id","permalink","media_type","timestamp")}
              summary["caption_sha_matches_receipt"] = (fingerprint == expected)
              if summary["caption_sha_matches_receipt"]:
                  matches.append(summary)
              if len(candidates) < 10:
                  summary["caption_length"] = len(caption)
                  candidates.append(summary)
          print("THREADS_EP145_RECONCILIATION " + json.dumps({
              "account": "ai_geopolitic", "posts_checked": len(data),
              "exact_matches": matches, "recent_candidates": candidates
          },sort_keys=True))
          if len(matches) != 1:
              raise SystemExit("Manual reconciliation remains necessary; no publish calls were attempted")
          print("FOUND_ONE_MATCHING_THREAD; READ_ONLY; NO_PUBLICATION_CALL")
          PY
