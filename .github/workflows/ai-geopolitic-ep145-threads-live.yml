name: AI Geopolitic Ep145 Threads LIVE — one-time approved carousel

on:
  push:
    branches:
      - main
    paths:
      - publisher_signals/threads-ep145-real-carousel-20261113.json

permissions:
  contents: write

concurrency:
  group: ai-geopolitic-threads-serial-release
  cancel-in-progress: false

jobs:
  publish-approved-threads-ep145:
    name: Exact 10-image Ep145 carousel to @ai_geopolitic, no Reel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AI_GEO_THREADS_ACCESS_TOKEN: ${{ secrets.AI_GEO_THREADS_ACCESS_TOKEN }}
    steps:
      - name: Checkout approved signal and durable publication state
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout pinned tested Threads publisher implementation
        uses: actions/checkout@v4
        with:
          ref: 7015bfb1e771975576db8708a0c714b52a68758e
          path: publisher_code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pinned publisher with no Meta writes
        working-directory: publisher_code
        run: |
          python -m pip install pytest==8.4.1 Pillow==11.3.0
          python -m pytest -q tests/test_threads_media.py tests/test_threads_release.py
      - name: Verify exact one-time user-approved Threads release signal
        shell: bash
        env:
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID }}
        run: |
          set -euo pipefail
          test -n "$AI_GEO_THREADS_ACCESS_TOKEN"
          test -n "$RCLONE_DRIVE_TOKEN"
          test -n "$AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID"
          test ! -e publisher_state/threads-ep145-20261113.json
          test ! -d publisher_media/threads-ep145-20261113
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('publisher_signals/threads-ep145-real-carousel-20261113.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          required={
             'schema':'ai-geopolitic.threads.live-approval-signal.v1',
             'episode':'Ep145',
             'date_sast':'2026-11-13',
             'destination':'@ai_geopolitic',
             'media_type':'TEN_IMAGE_CAROUSEL',
             'caption_source':'Ep145_CarouselCaption.txt',
             'publish_confirmation':'PUBLISH_THREADS_EP145_20261113',
             'source_run_id':'43408648808',
             'source_status':'PREFLIGHT_PASSED_NO_PUBLICATION',
             'only_one_publication':True,
          }
          if d != required:
              raise SystemExit('BLOCKED: exact owner-approved Ep145 Threads signal mismatch.')
          print('Exact one-time Threads human authorization verified; no Meta POST yet.')
          PY
      - name: Install read-only Drive rclone client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
      - name: Configure authenticated rclone from existing secrets
        env:
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/rclone"
          chmod 700 "$HOME/.config/rclone"
          printf '%s\n' \
            '[ai_geopolitic_drive]' \
            'type = drive' \
            "client_id = ${RCLONE_DRIVE_CLIENT_ID}" \
            "client_secret = ${RCLONE_DRIVE_CLIENT_SECRET}" \
            'scope = drive' \
            "token = ${RCLONE_DRIVE_TOKEN}" \
            "root_folder_id = ${AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID}" \
            > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
      - name: Recheck exact Drive QC, ten slides and original carousel caption
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'publisher_code')
          from src.threads_media import main
          raise SystemExit(main(['plan','--episode','Ep145','--date-sast','2026-11-13']))
          PY
      - name: Stage exactly ten QC-hash-matched slides for Threads only
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'publisher_code')
          from src.threads_media import main
          raise SystemExit(main(['stage','--episode','Ep145','--date-sast','2026-11-13']))
          PY
      - name: Upload publicly accessible immutable media on separate GitHub branch
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          folder='publisher_media/threads-ep145-20261113'
          branch="threads-media-ep145-20261113-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -- "$folder"
          git diff --cached --quiet && { echo 'BLOCKED: no new approved media staged'; exit 1; }
          git commit -m 'Stage ten QC-verified Ep145 Threads carousel JPEGs'
          git push origin "HEAD:refs/heads/$branch"
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git switch main
          mkdir -p "$folder"
          git show "$sha:$folder/stage.json" > "$folder/stage.json"
          git show "$sha:$folder/caption.txt" > "$folder/caption.txt"
          for i in $(seq -w 1 10); do
            git show "$sha:$folder/Slide${i}of10.jpg" > "$folder/Slide${i}of10.jpg"
          done
      - name: One-time claim then publish and verify Threads carousel
        shell: bash
        env:
          MEDIA_COMMIT: ${{ steps.stage.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,sys
          sys.path.insert(0,'publisher_code')
          from src.threads_release import main
          raise SystemExit(main(['--episode','Ep145','--date-sast','2026-11-13',
                                 '--media-commit',os.environ['MEDIA_COMMIT'],
                                 '--approval','PUBLISH_THREADS_EP145_20261113']))
          PY
      - name: Reconciliation instructions — never retry on ambiguous Meta outcome
        if: always()
        run: |
          echo 'Review publisher_state/threads-ep145-20261113.json on main.'
          echo 'CLAIMED_NO_AUTOMATIC_RETRY means uncertain Meta outcome: reconcile manually.'
          echo 'PUBLISHED_VERIFIED includes the live Threads permalink.'
          echo 'Instagram and Reel publishing are never called by this workflow.'
