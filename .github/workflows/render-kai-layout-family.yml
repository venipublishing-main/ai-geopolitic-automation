name: Render Milestone 4.3D Kai layout family

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full QA suite
        run: pytest -q

      - name: Render Kai layout family
        run: |
          python src/render_kai_layout_family.py --input inputs/kai-network-mesh.json --output output/kai-network-mesh.png
          python src/render_kai_layout_family.py --input inputs/kai-feedback-system.json --output output/kai-feedback-system.png
          python src/render_kai_layout_family.py --input inputs/kai-monitoring-loop.json --output output/kai-monitoring-loop.png
          python src/render_kai_layout_family.py --input inputs/kai-decentralised-pathway.json --output output/kai-decentralised-pathway.png
          python src/render_kai_layout_family.py --input inputs/kai-repair-network.json --output output/kai-repair-network.png
          python src/make_contact_sheet.py --files output/kai-network-mesh.png output/kai-feedback-system.png output/kai-monitoring-loop.png output/kai-decentralised-pathway.png output/kai-repair-network.png --output output/kai-layout-family-contact-sheet.png --cols 3 --thumb 320

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-geopolitic-milestone-4_3d-kai-layout-family
          path: output/kai-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' \
            '[ai_geopolitic_drive]' \
            'type = drive' \
            "client_id = ${RCLONE_DRIVE_CLIENT_ID}" \
            "client_secret = ${RCLONE_DRIVE_CLIENT_SECRET}" \
            'scope = drive' \
            "token = ${RCLONE_DRIVE_TOKEN}" \
            "root_folder_id = ${AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID}" \
            > ~/.config/rclone/rclone.conf

      - name: Upload Kai family proofs to Google Drive
        run: |
          DEST='Automation - Temporary Artifacts/Layout Families/Kai'
          rclone mkdir ai_geopolitic_drive:"${DEST}"
          rclone copy output/ ai_geopolitic_drive:"${DEST}" --include 'kai-*.png' --progress
