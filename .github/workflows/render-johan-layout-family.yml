name: Render Milestone 4.3B Johan layout family

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full QA suite
        run: pytest -q

      - name: Render Johan layout family
        run: |
          python src/render_johan_layout_family.py --input inputs/johan-institutional-spine.json --output output/johan-institutional-spine.png
          python src/render_johan_layout_family.py --input inputs/johan-containment-chain.json --output output/johan-containment-chain.png
          python src/render_johan_layout_family.py --input inputs/johan-oversight-gate.json --output output/johan-oversight-gate.png
          python src/render_johan_layout_family.py --input inputs/johan-order-corridor.json --output output/johan-order-corridor.png
          python src/render_johan_layout_family.py --input inputs/johan-principle-test.json --output output/johan-principle-test.png
          python src/make_contact_sheet.py --files output/johan-institutional-spine.png output/johan-containment-chain.png output/johan-oversight-gate.png output/johan-order-corridor.png output/johan-principle-test.png --output output/johan-layout-family-contact-sheet.png --cols 3 --thumb 320

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-geopolitic-milestone-4_3b-johan-layout-family
          path: output/johan-*.png
          if-no-files-found: error
          retention-days: 14

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_DRIVE_CLIENT_ID: ${{ secrets.RCLONE_DRIVE_CLIENT_ID }}
          RCLONE_DRIVE_CLIENT_SECRET: ${{ secrets.RCLONE_DRIVE_CLIENT_SECRET }}
          RCLONE_DRIVE_TOKEN: ${{ secrets.RCLONE_DRIVE_TOKEN }}
          AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' \
            '[ai_geopolitic_drive]' \
            'type = drive' \
            "client_id = ${RCLONE_DRIVE_CLIENT_ID}" \
            "client_secret = ${RCLONE_DRIVE_CLIENT_SECRET}" \
            'scope = drive' \
            "token = ${RCLONE_DRIVE_TOKEN}" \
            "root_folder_id = ${AI_GEOPOLITIC_DRIVE_ROOT_FOLDER_ID}" \
            > ~/.config/rclone/rclone.conf

      - name: Upload Johan family proofs to Google Drive
        run: |
          DEST='Automation - Temporary Artifacts/Layout Families/Johan'
          rclone mkdir ai_geopolitic_drive:"${DEST}"
          rclone copy output/ ai_geopolitic_drive:"${DEST}" --include 'johan-*.png' --progress
