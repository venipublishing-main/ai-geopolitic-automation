name: V3 readiness contract tests (zero generation)

on:
  push:
    branches:
      - feat/v3-10-slide-readiness-20261104
  pull_request:
    branches:
      - automation-v2

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pure test requirements
        run: python -m pip install pytest Pillow==11.3.0
      - name: Run frozen legacy plus active v3 readiness regressions
        run: python -m pytest -q tests/test_daily_readiness.py tests/test_v3_readiness.py tests/test_v3_drive_proof.py
